<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faella Crafts - Checkout</title>
<link rel="icon" href="data:,">
<link rel="shortcut icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff5f8;
  --cream-2:#ffe9f1;
  --text:#3b2a33;
  --muted:#7d6470;
  --olive:#b85a7f;
  --mustard:#f4c1d2;
  --coral:#f39ab3;
  --terracotta:#d77a98;
  --card:#ffffff;
}
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Montserrat',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{
  background: linear-gradient(180deg, var(--cream), var(--cream-2));
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}
.checkout-card{
  background:var(--card);
  border:1px solid rgba(0,0,0,.04);
  border-radius:18px;
  box-shadow:0 10px 28px rgba(0,0,0,.10);
  max-width:660px;
  width:100%;
  padding:28px 22px 24px;
  text-align:center;
}
.logo{
  width:220px;
  border-radius:999px;
  border:4px solid var(--mustard);
  box-shadow:0 10px 24px rgba(0,0,0,.12);
  margin:0 auto 14px;
  display:block;
  background:#ffffff;
}
h1{
  color:var(--terracotta);
  font-size:22px;
  margin-bottom:8px;
  text-transform:uppercase;
  letter-spacing:.08em;
}
h1 span{
  font-weight:300;
}
.summary{
  margin:18px 0 6px;
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0;
  font-size:14px;
}
.row.total{
  font-size:20px;
  font-weight:900;
  color:var(--olive);
  margin-top:12px;
}
.paypal-order-note{
  margin-top:12px;
  text-align:left;
  background:#fff7fb;
  border:1px solid rgba(216,122,152,.20);
  color:var(--muted);
  border-radius:14px;
  padding:12px 14px;
  font-size:13px;
  line-height:1.45;
}
.paypal-order-note strong{
  color:var(--olive);
}
.items{
  text-align:left;
  margin:12px 0 8px;
}
.item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin:6px 0;
}
.item-title{
  font-size:14px;
  font-weight:600;
  color:var(--text);
}
.item-sub{
  font-weight:800;
  color:var(--terracotta);
}
#paypal-section{
  margin-top:16px;
}
#paypal-button-paypal,
#paypal-button-card{
  margin-bottom:12px;
}
.helper{
  margin-top:12px;
  font-size:13px;
  color:var(--muted);
}
footer{
  margin-top:16px;
  color:var(--muted);
  font-size:12px;
}
.hidden{
  display:none !important;
}

/* Fulfilment options */
.fulfilment{
  margin-top:10px;
  border:1px dashed rgba(0,0,0,.08);
  border-radius:14px;
  padding:14px 14px 12px;
  text-align:left;
  background:#fffdfd;
}
.fulfilment h2{
  font-size:14px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--olive);
  margin-bottom:10px;
}
.opts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}
.opt{
  border:1px solid rgba(0,0,0,.06);
  border-radius:12px;
  padding:10px;
  display:flex;
  align-items:flex-start;
  gap:8px;
  cursor:pointer;
  background:#ffffff;
}
.opt input{
  margin-top:2px;
}
.opt .label{
  font-weight:700;
  font-size:14px;
}
.opt .sub{
  font-size:12px;
  color:var(--muted);
}
.badge{
  display:inline-block;
  font-size:11px;
  padding:2px 8px;
  border-radius:999px;
  background:var(--cream-2);
  border:1px solid rgba(0,0,0,.06);
  margin-left:6px;
}
.info{
  font-size:13px;
  color:var(--muted);
  background:#fff7fb;
  border:1px solid rgba(0,0,0,.05);
  padding:10px 12px;
  border-radius:12px;
}
.addr{
  font-weight:600;
  color:var(--text);
}

/* Return policy button */
.policy-btn{
  display:inline-block;
  margin:6px 0 16px;
  background: var(--terracotta);
  color:#fff;
  padding:8px 16px;
  border-radius:999px;
  font-weight:700;
  font-size:13px;
  text-decoration:none;
  box-shadow:0 6px 16px rgba(0,0,0,.14);
  text-transform:uppercase;
  letter-spacing:.08em;
}

/* Small screens */
@media (max-width:480px){
  .checkout-card{
    padding:22px 16px 18px;
  }
  .logo{
    width:190px;
  }
  h1{
    font-size:18px;
  }
  .opts{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<div class="checkout-card">
  <img src="logo.png" alt="Faella Crafts logo" class="logo">
  <h1><span>Faella Crafts</span> Checkout</h1>
  <a class="policy-btn" href="return-refund-policy.html" aria-label="Return & Refund Policy">
    Return Policy
  </a>

  <div class="items" id="cartList"></div>

  <!-- Fulfilment Options -->
  <div class="fulfilment" id="fulfilmentBox">
    <h2>Delivery / Pickup</h2>
    <div class="opts">
      <label class="opt" for="opt-delivery">
        <input type="radio" name="fulfilment" id="opt-delivery" value="delivery">
        <div>
          <div class="label">Delivery <span class="badge">Shipping €7 · Free from €50</span></div>
          <div class="sub">Estimated delivery time: 7 to 10 business days.</div>
        </div>
      </label>
      <label class="opt" for="opt-pickup">
        <input type="radio" name="fulfilment" id="opt-pickup" value="pickup">
        <div>
          <div class="label">Pickup <span class="badge">Free</span></div>
          <div class="sub">Centrepoint apartament Tuam roud H91 H308</div>
        </div>
      </label>
    </div>
    <div class="info" id="fulfilmentInfo">
      Estimated delivery time: 7 to 10 business days.
    </div>
  </div>

  <div class="summary">
    <div class="row">
      <span class="label">Products Subtotal</span>
      <span class="value" id="subtotalValue">€ 0.00</span>
    </div>
    <div class="row">
      <span class="label" id="shippingLabel">Shipping</span>
      <span class="value" id="shippingValue">€ 0.00</span>
    </div>
    <div class="row total">
      Total: € <span id="totalAmount">0.00</span>
    </div>
  </div>

  <div class="paypal-order-note" id="paypalOrderNote"></div>

  <div id="paypal-section">
    <div id="paypal-button-paypal"></div>
    <div id="paypal-button-card"></div>
    <div id="helperMsg" class="helper hidden">Add products to your cart to enable payment.</div>
  </div>

  <footer>© <span id="year"></span> Faella Crafts</footer>
</div>

<script src="https://www.paypal.com/sdk/js?client-id=AYyAFp_6STukM7czylcVIXHyRAN6lT1mF_ZD4v75kRFE4zoOWYhum_Dra8_YBFUp8I2TXk6PxEgxOVqq&currency=EUR&intent=capture&commit=true&locale=en_IE&components=buttons,funding-eligibility&enable-funding=card"></script>
<script>
// ===== Keys used by the site =====
const CART_KEYS_ORDER = ['cartItems'];
const FULFILMENT_KEY = 'fulfilment_mode'; // 'delivery' | 'pickup'
const CHECKOUT_API_BASE = (window.FAELLA_CHECKOUT_API_BASE || 'https://outstanding-patience-production-e001.up.railway.app').replace(/\/+$/, '');
const SHIPPING_FEE_CENTS = 700;
const FREE_SHIPPING_THRESHOLD_CENTS = 5000;

function readCartFromQuery(){
  try{
    const params = new URLSearchParams(window.location.search);
    const raw = params.get('cart');
    if(!raw) return [];
    const data = JSON.parse(raw);
    return Array.isArray(data) ? data : [];
  }catch(e){
    return [];
  }
}

// Year
document.getElementById('year').textContent = new Date().getFullYear();

function fmtEUR(n){ return '€ ' + Number(n).toFixed(2); }
function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g, function(ch){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]);
  });
}
function toCents(value){
  return Math.round((Number(value || 0) + Number.EPSILON) * 100);
}
function centsToPaypal(cents){
  return (Math.max(0, Number(cents || 0)) / 100).toFixed(2);
}
function readJSON(key){
  try{
    return JSON.parse(localStorage.getItem(key));
  }catch(e){
    return null;
  }
}

// Cart: first key that contains a non-empty array
function readCart(){
  for(const k of CART_KEYS_ORDER){
    const v = readJSON(k);
    if(Array.isArray(v) && v.length) return v;
  }
  const fromQuery = readCartFromQuery();
  if(fromQuery.length) return fromQuery;
  return [];
}

// Read fulfilment (default: delivery)
function readFulfilment(){
  const v = localStorage.getItem(FULFILMENT_KEY);
  if(v === 'pickup' || v === 'delivery') return v;
  return 'delivery';
}

// Shipping shown on the page. The server recalculates this again before payment.
// Delivery = €7. Delivery is free when products subtotal is €50 or more. Pickup = €0.
function computeShipping(fulfilment, subtotalCents){
  if(fulfilment === 'pickup'){
    return { amountCents: 0, label: 'Pickup (Free)', freeShippingApplied: false };
  }
  if(Number(subtotalCents || 0) >= FREE_SHIPPING_THRESHOLD_CENTS){
    return { amountCents: 0, label: 'Shipping (Free over €50)', freeShippingApplied: true };
  }
  return { amountCents: SHIPPING_FEE_CENTS, label: 'Shipping (€7)', freeShippingApplied: false };
}

// Normalize product fields (title/price/qty) for different cart formats.
// The server ignores client prices and validates the real price from products.json.
function normalizeCart(arr){
  return arr.map(item=>{
    const qty = Math.max(0, parseInt(item.qty ?? item.quantity ?? 1, 10) || 0);
    const price = Number(item.price ?? item.unitPrice ?? 0) || 0;
    const title = item.title ?? item.name ?? item.product?.title ?? 'Product';
    const id = item.id ?? item.sku ?? item.slug ?? title;
    return { id, qty, price, title };
  }).filter(x => x.qty > 0 && x.price >= 0);
}

function cartPayloadForServer(){
  return cart.map(item => ({
    id: item.id || item.title,
    qty: item.qty
  }));
}

async function postCheckout(path, payload){
  const response = await fetch(CHECKOUT_API_BASE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
    cache: 'no-store'
  });
  const data = await response.json().catch(() => ({}));
  if(!response.ok || data.ok === false){
    throw new Error(data.error || 'Server validation failed.');
  }
  return data;
}

let cart = normalizeCart(readCart());
let fulfilment = readFulfilment();
let lastCheckoutAlertAt = 0;
let serverQuoteRequestId = 0;

function showCheckoutAlert(message){
  lastCheckoutAlertAt = Date.now();
  alert(message);
}

// Initialize UI radios and info panel
function initFulfilmentUI(){
  const radioDelivery = document.getElementById('opt-delivery');
  const radioPickup = document.getElementById('opt-pickup');
  const info = document.getElementById('fulfilmentInfo');

  if(fulfilment === 'pickup'){ radioPickup.checked = true; }
  else { radioDelivery.checked = true; }

  function updateInfo(){
    info.textContent = (fulfilment === 'pickup')
      ? 'Pickup at: Centrepoint apartament Tuam roud H91 H308'
      : 'Estimated delivery time: 7 to 10 business days. Shipping is €7 and free from €50 in products.';
  }

  radioDelivery.addEventListener('change', () => {
    fulfilment = 'delivery';
    localStorage.setItem(FULFILMENT_KEY, fulfilment);
    updateInfo();
    renderSummary();
    syncServerQuote();
  });
  radioPickup.addEventListener('change', () => {
    fulfilment = 'pickup';
    localStorage.setItem(FULFILMENT_KEY, fulfilment);
    updateInfo();
    renderSummary();
    syncServerQuote();
  });

  updateInfo();
}

function fulfilmentMessage(totals){
  const subtotalCents = Number(totals?.subtotalCents || 0);
  const shippingCents = Number(totals?.shippingCents || 0);
  if(fulfilment === 'pickup'){
    return 'Pickup selected — no shipping charged.';
  }
  if(subtotalCents >= FREE_SHIPPING_THRESHOLD_CENTS && shippingCents === 0){
    return 'Delivery selected — free shipping applied because products subtotal is €50.00 or more.';
  }
  return 'Delivery selected — shipping paid: €7.00. Free shipping starts from €50.00 in products.';
}

function setPaymentEnabled(enabled, message){
  const helper = document.getElementById('helperMsg');
  const payBtn = document.getElementById('paypal-button-paypal');
  const cardBtn = document.getElementById('paypal-button-card');
  if(enabled){
    helper.classList.add('hidden');
    payBtn.classList.remove('hidden');
    cardBtn.classList.remove('hidden');
  }else{
    helper.textContent = message || 'Add products to your cart to enable payment.';
    helper.classList.remove('hidden');
    payBtn.classList.add('hidden');
    cardBtn.classList.add('hidden');
  }
}

function renderSummary(){
  const list = document.getElementById('cartList');
  const note = document.getElementById('paypalOrderNote');
  let subtotalCents = 0;
  if(!cart.length){
    list.innerHTML = '<p style="color:#6f6f6f;text-align:center;">Your cart is empty.</p>';
  }else{
    list.innerHTML = cart.map(item=>{
      const unitCents = toCents(item.price);
      const subCents = unitCents * item.qty;
      subtotalCents += subCents;
      return `<div class="item">
                <div class="item-title">${item.qty}× ${escapeHTML(item.title)}</div>
                <div class="item-sub">${fmtEUR(subCents / 100)}</div>
              </div>`;
    }).join('');
  }

  const ship = computeShipping(fulfilment, subtotalCents);
  const shippingCents = Number(ship.amountCents || 0);
  const subtotal = subtotalCents / 100;
  const effectiveTotalCents = subtotalCents > 0 ? subtotalCents + shippingCents : 0;

  document.getElementById('subtotalValue').textContent = fmtEUR(subtotal);
  document.getElementById('shippingLabel').textContent = ship.label || 'Shipping';
  document.getElementById('shippingValue').textContent = fmtEUR(shippingCents / 100);
  document.getElementById('totalAmount').textContent = centsToPaypal(effectiveTotalCents);

  if(subtotalCents > 0){
    setPaymentEnabled(true);
  }else{
    setPaymentEnabled(false);
  }

  if(note){
    const totals = { subtotalCents, shippingCents, totalCents: effectiveTotalCents };
    note.innerHTML = '<strong>Secure checkout:</strong> product prices, shipping and total are validated by the server before PayPal payment.<br>' + escapeHTML(fulfilmentMessage(totals));
  }

  return {
    subtotal: subtotalCents / 100,
    shipping: shippingCents / 100,
    total: effectiveTotalCents / 100,
    subtotalCents,
    shippingCents,
    totalCents: effectiveTotalCents
  };
}

function applyServerTotals(totals){
  if(!totals) return;
  const list = document.getElementById('cartList');
  const note = document.getElementById('paypalOrderNote');

  if(Array.isArray(totals.items) && totals.items.length){
    list.innerHTML = totals.items.map(item => {
      const qty = Number(item.qty || 0);
      const subtotalCents = Number(item.subtotalCents || 0);
      return `<div class="item">
                <div class="item-title">${qty}× ${escapeHTML(item.title || 'Product')}</div>
                <div class="item-sub">${fmtEUR(subtotalCents / 100)}</div>
              </div>`;
    }).join('');
  }

  document.getElementById('subtotalValue').textContent = fmtEUR(Number(totals.subtotalCents || 0) / 100);
  document.getElementById('shippingLabel').textContent = totals.shippingLabel || 'Shipping';
  document.getElementById('shippingValue').textContent = fmtEUR(Number(totals.shippingCents || 0) / 100);
  document.getElementById('totalAmount').textContent = centsToPaypal(Number(totals.totalCents || 0));

  if(Number(totals.totalCents || 0) > 0){
    setPaymentEnabled(true);
  }

  if(note){
    note.innerHTML = '<strong>Server validated summary:</strong> product prices, shipping and total confirmed securely before payment.<br>' + escapeHTML(fulfilmentMessage(totals));
  }
}

async function syncServerQuote(){
  if(!cart.length) return;
  const requestId = ++serverQuoteRequestId;
  try{
    const data = await postCheckout('/api/checkout/quote', {
      fulfilment,
      cart: cartPayloadForServer()
    });
    if(requestId !== serverQuoteRequestId) return;
    applyServerTotals(data.totals);
  }catch(err){
    console.warn('Server quote failed:', err);
    if(requestId !== serverQuoteRequestId) return;
    setPaymentEnabled(false, 'Server validation failed. Please refresh the cart and try again.');
    const note = document.getElementById('paypalOrderNote');
    if(note){
      note.innerHTML = '<strong>Server validation failed:</strong> ' + escapeHTML(err.message || 'Please refresh the cart and try again.');
    }
  }
}

const state = renderSummary();
initFulfilmentUI();
syncServerQuote();

function clearCartAfterPayment(details){
  alert('✅ Payment completed by ' + (details?.payer?.name?.given_name || 'customer') + '!');
  CART_KEYS_ORDER.forEach(k=>localStorage.removeItem(k));
  localStorage.removeItem(FULFILMENT_KEY);
  cart = [];
  document.getElementById('cartList').innerHTML = '<p style="color:var(--olive);text-align:center;">Payment Approved!</p>';
  document.getElementById('subtotalValue').textContent = fmtEUR(0);
  document.getElementById('shippingLabel').textContent = 'Shipping';
  document.getElementById('shippingValue').textContent = fmtEUR(0);
  document.getElementById('totalAmount').textContent = '0.00';
  setPaymentEnabled(false, 'Payment approved. Your cart is now empty.');
}

function commonConfig(){
  return {
    onClick: function(data, actions){
      renderSummary();
      if(!cart.length){
        alert('Please add products before paying.');
        return actions.reject();
      }
      return actions.resolve();
    },
    createOrder: function(){
      renderSummary();
      if(!cart.length){ throw new Error('Empty cart'); }

      return postCheckout('/api/paypal/create-order', {
        fulfilment,
        cart: cartPayloadForServer()
      }).then(function(data){
        if(data.totals) applyServerTotals(data.totals);
        if(!data.id){ throw new Error('PayPal order was not created by the server.'); }
        return data.id;
      }).catch(function(err){
        console.error('Server PayPal create-order failed:', err);
        showCheckoutAlert('❌ Could not validate your cart on the server. Please refresh and try again.');
        throw err;
      });
    },
    onApprove: function(data){
      return postCheckout('/api/paypal/capture-order', {
        orderId: data.orderID
      }).then(function(result){
        clearCartAfterPayment(result.capture || {});
      }).catch(function(err){
        console.error('Server PayPal capture failed:', err);
        showCheckoutAlert('❌ Payment could not be confirmed by the server. Please contact Faella Crafts before trying again.');
        throw err;
      });
    },
    onError: function(err){
      console.error('PayPal error:', err);
      if(Date.now() - lastCheckoutAlertAt > 1500){
        alert('❌ There was an issue with PayPal Checkout. Please try again.');
      }
    }
  };
}

// Render PayPal buttons when cart has products
if(typeof paypal !== 'undefined' && cart.length > 0){
  const btnPayPal = paypal.Buttons(Object.assign({}, commonConfig(), {
    fundingSource: paypal.FUNDING.PAYPAL,
    style:{ layout:'vertical', color:'gold', shape:'pill', label:'paypal', height:45 }
  }));
  if(btnPayPal.isEligible()) btnPayPal.render('#paypal-button-paypal');

  const btnCard = paypal.Buttons(Object.assign({}, commonConfig(), {
    fundingSource: paypal.FUNDING.CARD,
    style:{ layout:'vertical', color:'black', shape:'pill', label:'pay', height:45 }
  }));
  if(btnCard.isEligible()) btnCard.render('#paypal-button-card');
}
</script>

</body>
</html>
