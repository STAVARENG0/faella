<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Faella Crafts | Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --rosa-principal: #eac2ca;
      --rosa-escuro: #d49aa7;
      --rosa-claro: #f7e4ea;
      --verde-botao: #1fae3b;
      --cinza-texto: #555;
      --card:#ffffff;
      --radius:28px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Montserrat",sans-serif;
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(180deg,#fff,var(--rosa-claro));
    }
    .wrap{width:min(92vw,520px)}
    .card{
      background:#fff;
      border-radius:var(--radius);
      padding:30px;
      box-shadow:0 18px 42px rgba(0,0,0,.18);
    }
    .top-pill{text-align:center;margin-bottom:14px}
    .top-pill span{
      padding:6px 14px;
      border-radius:999px;
      background:var(--rosa-principal);
      color:#fff;
      font-weight:700;
      font-size:.8rem;
    }
    .logo-circle{
      width:160px;height:160px;margin:0 auto 14px;
      border-radius:50%;
      border:4px solid var(--rosa-principal);
      display:flex;align-items:center;justify-content:center;
    }
    .logo-circle img{width:100%;height:100%;object-fit:contain}
    h1{text-align:center;font-size:1.1rem}
    label{font-size:.85rem;font-weight:600}
    input{
      width:100%;padding:12px;margin-bottom:10px;
      border-radius:999px;border:1px solid #eac2ca;
    }
    button{
      width:100%;padding:12px;border-radius:999px;
      border:none;background:linear-gradient(90deg,var(--rosa-escuro),var(--rosa-principal));
      color:#fff;font-weight:800;cursor:pointer;
    }
    .err{
      display:none;
      margin-bottom:12px;
      padding:10px;
      background:#ffe6e6;
      color:#8a1f1f;
      border-radius:14px;
      text-align:center;
    }
    a.small{display:block;text-align:center;margin-top:12px;color:#666;text-decoration:none}
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">

    <div class="top-pill"><span>FAELLA ADMIN</span></div>

    <div class="logo-circle">
      <img src="logo.png" alt="Faella Crafts">
    </div>

    <h1>Sign in — Faella Crafts</h1>

    <div id="err" class="err"></div>

    <form id="loginForm">
      <label>Username</label>
      <input id="u" required>

      <label>Password</label>
      <input id="p" type="password" required>

      <button type="submit">SIGN IN</button>
      <a class="small" href="index.html">← Back to site</a>
    </form>

  </div>
</div>

<script>
const BACKEND_URL = "https://outstanding-patience.up.railway.app";

const form = document.getElementById("loginForm");
const err = document.getElementById("err");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.style.display = "none";

  const u = document.getElementById("u").value.trim();
  const p = document.getElementById("p").value;

  try {
    const res = await fetch(`${BACKEND_URL}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ username: u, password: p })
    });

    const data = await res.json();

    if (!res.ok || !data.ok) {
      err.style.display = "block";
      err.textContent = "Invalid username or password.";
      return;
    }

    window.location.href = "/painel";
  } catch {
    err.style.display = "block";
    err.textContent = "Server error. Try again.";
  }
});
</script>
</body>
</html>
