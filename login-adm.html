<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Faella Crafts | Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --rosa-principal:#eac2ca;
      --rosa-escuro:#d49aa7;
      --rosa-claro:#f7e4ea;
      --verde-botao:#1fae3b;
      --cinza-texto:#555;
      --card:#ffffff;
      --radius:28px;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

    html,body{width:100%;min-height:100%}

    body{
      margin:0;
      font-family:"Montserrat",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--cinza-texto);
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 10px;
      background:
        radial-gradient(circle at 20% 10%, rgba(234,194,202,.55), transparent 45%),
        radial-gradient(circle at 85% 25%, rgba(212,154,167,.40), transparent 55%),
        linear-gradient(180deg, #fff, var(--rosa-claro));
      position:relative;
      overflow-x:hidden;
    }

    #reactiveField{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
    }

    .wrap{
      width:min(92vw,520px);
      margin:0 auto;
      position:relative;
      z-index:1;
    }

    .card{
      background:rgba(255,255,255,.90);
      backdrop-filter:blur(8px) saturate(115%);
      -webkit-backdrop-filter:blur(8px) saturate(115%);
      border-radius:var(--radius);
      border:1px solid rgba(234,194,202,.9);
      box-shadow:0 18px 42px rgba(0,0,0,.18);
      padding:30px;
    }

    .top-pill{display:flex;justify-content:center;margin-bottom:14px}
    .top-pill span{
      display:inline-flex;align-items:center;justify-content:center;
      padding:6px 14px;border-radius:999px;background:var(--rosa-principal);color:#fff;
      font-size:.82rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
      box-shadow:0 10px 24px rgba(0,0,0,.12);
    }

    .brand{display:flex;align-items:center;justify-content:center;margin-bottom:10px;flex-direction:column}
    .logo-circle{
      width:170px;height:170px;border-radius:50%;background:#fff;display:flex;
      align-items:center;justify-content:center;border:4px solid var(--rosa-principal);overflow:hidden;
    }
    .logo-circle img{width:100%;height:100%;object-fit:contain;border-radius:50%;background:transparent}
    .brand::after{
      content:"";display:block;width:min(420px,92%);height:3px;margin:12px auto 2px;
      background:linear-gradient(90deg, transparent, rgba(234,194,202,.95), transparent);border-radius:999px;
    }

    h1{margin:0 0 14px;font-size:1.2rem;text-align:center;font-weight:800;letter-spacing:.02em;color:#333}
    label{font-size:.88rem;color:#666;display:block;margin:10px 0 6px;font-weight:600}

    input{
      width:100%;padding:12px 14px;border-radius:999px;border:1px solid rgba(234,194,202,.95);
      background:rgba(255,255,255,.95);color:#333;font-size:16px;outline:none;box-shadow:0 10px 26px rgba(0,0,0,.06);
      appearance:none;-webkit-appearance:none;
    }
    input:focus{
      border-color:rgba(212,154,167,.95);
      box-shadow:0 10px 26px rgba(0,0,0,.06),0 0 0 3px rgba(234,194,202,.35);
    }

    button,.manual-link{
      width:100%;padding:12px 14px;border-radius:999px;border:none;cursor:pointer;margin-top:14px;
      font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;
      background:linear-gradient(90deg, var(--rosa-escuro), var(--rosa-principal));
      box-shadow:0 12px 26px rgba(0,0,0,.14);
      transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;
      text-decoration:none;display:block;text-align:center;
    }
    button:hover,.manual-link:hover{filter:brightness(.98);transform:translateY(-1px);box-shadow:0 14px 30px rgba(0,0,0,.18)}
    button:active,.manual-link:active{transform:translateY(0);box-shadow:0 10px 22px rgba(0,0,0,.14)}
    button:disabled{opacity:.75;cursor:wait;transform:none}

    .err,.ok{
      padding:10px 12px;border-radius:14px;display:none;margin:0 0 12px;text-align:center;font-size:.92rem;font-weight:600;
    }
    .err{color:#8a1f1f;background:rgba(255,230,230,.95);border:1px solid rgba(242,179,179,.9)}
    .ok{color:#175c24;background:rgba(232,255,236,.95);border:1px solid rgba(155,224,168,.9)}

    a.small{display:block;text-align:center;color:#666;font-size:.9rem;text-decoration:none;margin-top:12px;font-weight:600}
    a.small:hover{filter:brightness(.95)}

    .loading-indicator{display:none;text-align:center;margin-top:10px;font-size:.9rem;color:#666;font-weight:600}
    .loading-dots span{
      display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 2px;background:var(--verde-botao);
      animation:loading-bounce .8s infinite alternate;
    }
    .loading-dots span:nth-child(2){animation-delay:.15s}
    .loading-dots span:nth-child(3){animation-delay:.3s}
    .hidden{display:none}

    @keyframes loading-bounce{0%{transform:translateY(0);opacity:.6}100%{transform:translateY(-4px);opacity:1}}

    @media (max-width:600px){.logo-circle{width:150px;height:150px}.card{padding:26px 18px}}
    @media (hover:none),(pointer:coarse){#reactiveField{display:none}}
  </style>
</head>
<body>
  <canvas id="reactiveField" aria-hidden="true"></canvas>

  <div class="wrap">
    <div class="card">
      <div class="top-pill"><span>Faella Admin</span></div>

      <div class="brand">
        <div class="logo-circle">
          <img src="logo.png" alt="Faella Crafts logo">
        </div>
      </div>

      <h1>Entrar no painel</h1>

      <div id="err" class="err">Usuário ou senha inválidos.</div>
      <div id="ok" class="ok">Login feito. Abrindo painel...</div>

      <form id="loginForm" autocomplete="off" novalidate>
        <label for="u">Usuário</label>
        <input type="text" id="u" autocomplete="username" required placeholder="seu usuário">

        <label for="p">Senha</label>
        <input type="password" id="p" autocomplete="current-password" required placeholder="sua senha">

        <button type="submit" id="submitBtn">Entrar</button>

        <div id="loadingPanel" class="loading-indicator" aria-live="polite">
          <span class="loading-text">Abrindo painel</span>
          <span class="loading-dots"><span></span><span></span><span></span></span>
        </div>

        <a id="manualPanelLink" class="manual-link hidden" href="/painel">Abrir painel manualmente</a>
        <a class="small" href="index.html">← Voltar ao site</a>
      </form>
    </div>
  </div>

<script>
(function(){
  var BACKEND_URL = "https://outstanding-patience-production-e001.up.railway.app";
  var form = document.getElementById("loginForm");
  var err = document.getElementById("err");
  var ok = document.getElementById("ok");
  var btn = document.getElementById("submitBtn");
  var loadingPanel = document.getElementById("loadingPanel");
  var manualPanelLink = document.getElementById("manualPanelLink");

  function isSameOriginBackend(){
    return window.location.origin === BACKEND_URL;
  }

  function showError(message){
    ok.style.display = "none";
    err.textContent = message;
    err.style.display = "block";
    btn.disabled = false;
    loadingPanel.style.display = "none";
  }

  function showSuccess(){
    err.style.display = "none";
    ok.style.display = "block";
    loadingPanel.style.display = "block";
  }

  function goToPanel(){
    var sameOriginPanel = "/painel";
    var backendPanel = BACKEND_URL + "/painel";

    manualPanelLink.href = isSameOriginBackend() ? sameOriginPanel : backendPanel;
    manualPanelLink.className = "manual-link";

    setTimeout(function(){
      try {
        window.location.replace(manualPanelLink.href);
      } catch (e) {
        window.location.href = manualPanelLink.href;
      }
    }, 250);

    setTimeout(function(){
      if (document.visibilityState === "visible") {
        manualPanelLink.textContent = "Toque aqui se o painel não abrir";
        manualPanelLink.focus();
      }
    }, 1800);
  }

  async function doJsonLogin(username, password){
    return fetch(BACKEND_URL + "/auth/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      credentials: "include",
      body: JSON.stringify({ username: username, password: password })
    });
  }

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    err.style.display = "none";
    ok.style.display = "none";
    manualPanelLink.className = "manual-link hidden";
    btn.disabled = true;
    loadingPanel.style.display = "block";

    var username = document.getElementById("u").value.replace(/^\s+|\s+$/g, "");
    var password = document.getElementById("p").value;

    if (!username || !password) {
      showError("Preencha usuário e senha.");
      return;
    }

    try {
      var res = await doJsonLogin(username, password);
      var data = {};

      try {
        data = await res.json();
      } catch (_err) {
        data = {};
      }

      if (!res.ok || data.ok === false) {
        if (res.status === 401) showError("Usuário ou senha inválidos.");
        else if (res.status === 404) showError("Rota de login não encontrada.");
        else if (res.status === 405) showError("Método de login não aceito pelo servidor.");
        else showError("Erro no servidor. Tente novamente.");
        return;
      }

      try {
        sessionStorage.setItem("faella_login_ok", "1");
        sessionStorage.setItem("faella_login_time", String(Date.now()));
      } catch (_e) {}

      showSuccess();
      goToPanel();
    } catch (error) {
      showError("Erro ao conectar com o servidor.");
      if (window.console && console.error) console.error(error);
    }
  });

  if (window.matchMedia && window.matchMedia("(hover: none), (pointer: coarse)").matches) {
    return;
  }

  var canvas = document.getElementById("reactiveField");
  var ctx = canvas.getContext("2d");
  var w = 0, h = 0, mx = 0, my = 0, t = 0;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    mx = w / 2;
    my = h / 2;
  }

  function onPointerMove(e){
    if (typeof e.clientX === "number" && typeof e.clientY === "number") {
      mx = e.clientX;
      my = e.clientY;
    }
  }

  window.addEventListener("resize", resize, { passive:true });
  window.addEventListener("mousemove", onPointerMove, { passive:true });
  resize();

  function draw(){
    t += 0.01;
    ctx.clearRect(0,0,w,h);

    var g = ctx.createRadialGradient(mx,my,0,mx,my,180);
    g.addColorStop(0, "rgba(234,194,202,0.22)");
    g.addColorStop(1, "rgba(234,194,202,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);

    for (var i = 0; i < 22; i++) {
      var px = (mx + Math.cos(t + i) * 120) + Math.sin(t * 1.3 + i) * 60;
      var py = (my + Math.sin(t + i) * 120) + Math.cos(t * 1.2 + i) * 60;
      ctx.beginPath();
      ctx.arc(px, py, 2.2, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(212,154,167,0.35)";
      ctx.fill();
    }

    window.requestAnimationFrame(draw);
  }

  draw();
})();
</script>
</body>
</html>
