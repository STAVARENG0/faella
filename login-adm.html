<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <title>Faella Crafts | Login Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --rosa-principal:#eac2ca;
      --rosa-escuro:#d49aa7;
      --rosa-claro:#f7e4ea;
      --verde-botao:#1fae3b;
      --cinza-texto:#555;
      --card:#ffffff;
      --radius:28px;
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      min-height:100%;
    }

    body{
      margin:0;
      font-family:"Montserrat",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--cinza-texto);
      min-height:100vh;
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 12px calc(24px + env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 20% 10%, rgba(234,194,202,.55), transparent 45%),
        radial-gradient(circle at 85% 25%, rgba(212,154,167,.40), transparent 55%),
        linear-gradient(180deg, #fff, var(--rosa-claro));
      position:relative;
      overflow-x:hidden;
      -webkit-text-size-adjust:100%;
    }

    #reactiveField{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
    }

    .wrap{
      width:min(92vw,520px);
      margin:0 auto;
      position:relative;
      z-index:1;
    }

    .card{
      background:rgba(255,255,255,.92);
      -webkit-backdrop-filter:blur(8px) saturate(115%);
      backdrop-filter:blur(8px) saturate(115%);
      border-radius:var(--radius);
      border:1px solid rgba(234,194,202,.9);
      box-shadow:0 18px 42px rgba(0,0,0,.18);
      padding:30px;
    }

    .top-pill{
      display:flex;
      justify-content:center;
      margin-bottom:14px;
    }

    .top-pill span{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:6px 14px;
      border-radius:999px;
      background:var(--rosa-principal);
      color:#fff;
      font-size:.82rem;
      font-weight:700;
      letter-spacing:.04em;
      text-transform:uppercase;
      box-shadow:0 10px 24px rgba(0,0,0,.12);
    }

    .brand{
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:10px;
      flex-direction:column;
    }

    .logo-circle{
      width:170px;
      height:170px;
      border-radius:50%;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      border:4px solid var(--rosa-principal);
      overflow:hidden;
    }

    .logo-circle img{
      width:100%;
      height:100%;
      object-fit:contain;
      border-radius:50%;
      background:transparent;
    }

    .brand::after{
      content:"";
      display:block;
      width:min(420px,92%);
      height:3px;
      margin:12px auto 2px;
      background:linear-gradient(90deg, transparent, rgba(234,194,202,.95), transparent);
      border-radius:999px;
    }

    h1{
      margin:0 0 14px;
      font-size:1.2rem;
      text-align:center;
      font-weight:800;
      letter-spacing:.02em;
      color:#333;
    }

    label{
      font-size:.88rem;
      color:#666;
      display:block;
      margin:10px 0 6px;
      font-weight:600;
    }

    input{
      width:100%;
      padding:12px 14px;
      border-radius:999px;
      border:1px solid rgba(234,194,202,.95);
      background:rgba(255,255,255,.98);
      color:#333;
      font-size:16px;
      outline:none;
      box-shadow:0 10px 26px rgba(0,0,0,.06);
      -webkit-appearance:none;
      appearance:none;
    }

    input:focus{
      border-color:rgba(212,154,167,.95);
      box-shadow:0 10px 26px rgba(0,0,0,.06),0 0 0 3px rgba(234,194,202,.35);
    }

    button{
      width:100%;
      padding:12px 14px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      margin-top:14px;
      font-weight:800;
      letter-spacing:.06em;
      text-transform:uppercase;
      color:#fff;
      background:linear-gradient(90deg, var(--rosa-escuro), var(--rosa-principal));
      box-shadow:0 12px 26px rgba(0,0,0,.14);
      transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;
      -webkit-appearance:none;
      appearance:none;
    }

    button:hover{
      filter:brightness(.98);
      transform:translateY(-1px);
      box-shadow:0 14px 30px rgba(0,0,0,.18);
    }

    button:active{
      transform:translateY(0);
      box-shadow:0 10px 22px rgba(0,0,0,.14);
    }

    button:disabled{
      opacity:.75;
      cursor:not-allowed;
      transform:none;
    }

    .err{
      color:#8a1f1f;
      background:rgba(255,230,230,.95);
      border:1px solid rgba(242,179,179,.9);
      padding:10px 12px;
      border-radius:14px;
      display:none;
      margin:0 0 12px;
      text-align:center;
      font-size:.92rem;
      font-weight:600;
    }

    .ok{
      color:#166534;
      background:rgba(220,252,231,.96);
      border:1px solid rgba(134,239,172,.9);
      padding:10px 12px;
      border-radius:14px;
      display:none;
      margin:0 0 12px;
      text-align:center;
      font-size:.92rem;
      font-weight:600;
    }

    a.small{
      display:block;
      text-align:center;
      color:#666;
      font-size:.9rem;
      text-decoration:none;
      margin-top:12px;
      font-weight:600;
    }

    .loading-indicator{
      display:none;
      text-align:center;
      margin-top:10px;
      font-size:.9rem;
      color:#666;
      font-weight:600;
    }

    .loading-dots span{
      display:inline-block;
      width:7px;
      height:7px;
      border-radius:50%;
      margin:0 2px;
      background:var(--verde-botao);
      animation:loading-bounce .8s infinite alternate;
    }

    .loading-dots span:nth-child(2){ animation-delay:.15s; }
    .loading-dots span:nth-child(3){ animation-delay:.3s; }

    @keyframes loading-bounce{
      0%{ transform:translateY(0); opacity:.6; }
      100%{ transform:translateY(-4px); opacity:1; }
    }

    @media (max-width: 600px){
      .logo-circle{ width:150px; height:150px; }
      .card{ padding:26px 18px; }
    }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
      .card{ background:#ffffff; }
    }
  </style>
</head>
<body>
  <canvas id="reactiveField" aria-hidden="true"></canvas>

  <div class="wrap">
    <div class="card">
      <div class="top-pill">
        <span>Faella Admin</span>
      </div>

      <div class="brand">
        <div class="logo-circle">
          <img src="logo.png" alt="Faella Crafts logo">
        </div>
      </div>

      <h1>Entrar no painel</h1>

      <div id="err" class="err">Usuário ou senha inválidos.</div>
      <div id="ok" class="ok">Login feito. Abrindo painel...</div>

      <form id="loginForm" autocomplete="on" novalidate>
        <label for="u">Usuário</label>
        <input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required placeholder="seu usuário">

        <label for="p">Senha</label>
        <input type="password" id="p" name="password" autocomplete="current-password" required placeholder="sua senha">

        <button type="submit" id="submitBtn">Entrar</button>

        <div id="loadingPanel" class="loading-indicator" aria-live="polite">
          <span class="loading-text">Abrindo painel</span>
          <span class="loading-dots"><span></span><span></span><span></span></span>
        </div>

        <a class="small" href="/index.html">← Voltar ao site</a>
      </form>
    </div>
  </div>

<script>
(function(){
  'use strict';

  var form = document.getElementById('loginForm');
  var err = document.getElementById('err');
  var ok = document.getElementById('ok');
  var btn = document.getElementById('submitBtn');
  var loadingPanel = document.getElementById('loadingPanel');

  function showError(message){
    ok.style.display = 'none';
    err.textContent = message;
    err.style.display = 'block';
  }

  function showSuccess(message){
    err.style.display = 'none';
    ok.textContent = message;
    ok.style.display = 'block';
  }

  function setLoading(state){
    btn.disabled = !!state;
    loadingPanel.style.display = state ? 'block' : 'none';
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    err.style.display = 'none';
    ok.style.display = 'none';
    setLoading(true);

    var u = document.getElementById('u').value.trim();
    var p = document.getElementById('p').value;

    try {
      var res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username: u, password: p })
      });

      var data = {};
      try {
        data = await res.json();
      } catch(parseError) {
        data = {};
      }

      if (!res.ok || !data.ok) {
        if (res.status === 401) {
          showError('Usuário ou senha inválidos.');
        } else if (res.status === 404) {
          showError('Rota de login não encontrada no servidor.');
        } else {
          showError('Erro no servidor. Tente novamente.');
        }
        setLoading(false);
        return;
      }

      showSuccess('Login feito. Abrindo painel...');
      window.location.href = '/painel';
    } catch (error) {
      console.error(error);
      showError('Não foi possível conectar ao servidor.');
      setLoading(false);
    }
  });

  (function(){
    var canvas = document.getElementById('reactiveField');
    if (!canvas || !canvas.getContext) return;

    var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (isTouch || prefersReduced) {
      canvas.style.display = 'none';
      return;
    }

    var ctx = canvas.getContext('2d');
    if (!ctx) return;

    var raf = window.requestAnimationFrame || function(cb){ return setTimeout(cb, 16); };
    var w = 0, h = 0, mx = window.innerWidth / 2, my = window.innerHeight / 2, t = 0;

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }

    function onMove(e){
      if (!e) return;
      mx = e.clientX;
      my = e.clientY;
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', onMove, { passive:true });
    resize();

    function draw(){
      t += 0.01;
      ctx.clearRect(0,0,w,h);

      var g = ctx.createRadialGradient(mx,my,0,mx,my,180);
      g.addColorStop(0, 'rgba(234,194,202,0.22)');
      g.addColorStop(1, 'rgba(234,194,202,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,w,h);

      for (var i = 0; i < 22; i++) {
        var px = (mx + Math.cos(t + i) * 120) + Math.sin(t * 1.3 + i) * 60;
        var py = (my + Math.sin(t + i) * 120) + Math.cos(t * 1.2 + i) * 60;
        ctx.beginPath();
        ctx.arc(px, py, 2.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(212,154,167,0.35)';
        ctx.fill();
      }

      raf(draw);
    }

    draw();
  })();
})();
</script>
</body>
</html>
